<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <title>定时任务示意：按每日、工作日、每周或延时编排的任务列表</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#1f211f" />
      <stop offset="1" stop-color="#111211" />
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#fff" fill-opacity="0.05" />
    </pattern>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .m { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)" />
  <rect width="1600" height="1000" fill="url(#dots)" />

  <rect x="120.5" y="100.5" width="1359" height="799" rx="26" fill="#1a1b1a" stroke="#30332f" />
  <text class="t" x="176" y="186" font-size="40" font-weight="600" fill="#ecede9">定时任务</text>
  <text class="t" x="176" y="228" font-size="24" fill="#6d716b">4 个任务 · 3 个已启用</text>
  <rect x="1220" y="150" width="204" height="56" rx="28" fill="#ecede9" />
  <text class="t" x="1322" y="187" text-anchor="middle" font-size="26" font-weight="500" fill="#151615">+ 新建任务</text>
  <path d="M121 260.5H1479" stroke="#2a2d2a" />

  <!-- 行 1 -->
  <rect x="150" y="300" width="4" height="60" rx="2" fill="#ee735a" />
  <text class="m" x="176" y="344" font-size="44" fill="#ecede9">09:00</text>
  <text class="t" x="360" y="326" font-size="32" font-weight="500" fill="#ecede9">晨间信息汇总</text>
  <text class="t" x="360" y="366" font-size="24" fill="#8a8e88">汇总邮件、Issue 与日历</text>
  <rect x="980.5" y="308.5" width="119" height="43" rx="21.5" fill="#242624" stroke="#33362f" />
  <text class="t" x="1040" y="338" text-anchor="middle" font-size="24" fill="#c9ccc6">每日</text>
  <rect x="1340" y="308" width="84" height="44" rx="22" fill="#ee735a" />
  <circle cx="1402" cy="330" r="17" fill="#fff" />
  <path d="M176 400.5H1424" stroke="#262826" />

  <!-- 行 2 -->
  <text class="m" x="176" y="484" font-size="44" fill="#ecede9">12:30</text>
  <text class="t" x="360" y="466" font-size="32" font-weight="500" fill="#ecede9">依赖安全检查</text>
  <rect x="572" y="438" width="104" height="38" rx="19" fill="#6cc48a" fill-opacity="0.14" />
  <text class="t" x="624" y="465" text-anchor="middle" font-size="22" fill="#6cc48a">已补跑</text>
  <text class="t" x="360" y="506" font-size="24" fill="#8a8e88">扫描 Cargo 与 npm 依赖</text>
  <rect x="980.5" y="448.5" width="119" height="43" rx="21.5" fill="#242624" stroke="#33362f" />
  <text class="t" x="1040" y="478" text-anchor="middle" font-size="24" fill="#c9ccc6">工作日</text>
  <rect x="1340" y="448" width="84" height="44" rx="22" fill="#ee735a" />
  <circle cx="1402" cy="470" r="17" fill="#fff" />
  <path d="M176 540.5H1424" stroke="#262826" />

  <!-- 行 3 -->
  <text class="m" x="176" y="624" font-size="44" fill="#ecede9">18:00</text>
  <text class="t" x="360" y="606" font-size="32" font-weight="500" fill="#ecede9">周报生成</text>
  <text class="t" x="360" y="646" font-size="24" fill="#8a8e88">整理本周提交，输出 Word 周报</text>
  <rect x="980.5" y="588.5" width="119" height="43" rx="21.5" fill="#242624" stroke="#33362f" />
  <text class="t" x="1040" y="618" text-anchor="middle" font-size="24" fill="#c9ccc6">每周五</text>
  <rect x="1340" y="588" width="84" height="44" rx="22" fill="#ee735a" />
  <circle cx="1402" cy="610" r="17" fill="#fff" />
  <path d="M176 680.5H1424" stroke="#262826" />

  <!-- 行 4 -->
  <text class="m" x="176" y="764" font-size="44" fill="#6d716b">+30m</text>
  <text class="t" x="360" y="746" font-size="32" font-weight="500" fill="#9ca09a">部署后回归</text>
  <text class="t" x="360" y="786" font-size="24" fill="#6d716b">延时 30 分钟后执行</text>
  <rect x="980.5" y="728.5" width="119" height="43" rx="21.5" fill="#1f201f" stroke="#2c2e2c" />
  <text class="t" x="1040" y="758" text-anchor="middle" font-size="24" fill="#8a8e88">单次</text>
  <rect x="1340" y="728" width="84" height="44" rx="22" fill="#2e312e" />
  <circle cx="1362" cy="750" r="17" fill="#6d716b" />

  <text class="m" x="176" y="864" font-size="22" fill="#6d716b">下次运行 · 明天 09:00</text>
</svg>
