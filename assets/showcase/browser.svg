<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <title>内置浏览器示意：Agent 在页面中导航、填表与点击，步骤同步显示</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#1f211f" />
      <stop offset="1" stop-color="#111211" />
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#fff" fill-opacity="0.05" />
    </pattern>
    <clipPath id="win"><rect x="90" y="110" width="1000" height="780" rx="22" /></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .m { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)" />
  <rect width="1600" height="1000" fill="url(#dots)" />

  <!-- 浏览器 -->
  <g clip-path="url(#win)">
    <rect x="90" y="110" width="1000" height="780" fill="#1a1b1a" />
    <rect x="210" y="124" width="250" height="60" rx="12" fill="#232523" />
    <rect x="90" y="170" width="1000" height="64" fill="#232523" />
    <rect x="90" y="234" width="1000" height="656" fill="#f4f4f1" />
  </g>
  <circle cx="126" cy="146" r="7" fill="#3a3d3a" />
  <circle cx="150" cy="146" r="7" fill="#3a3d3a" />
  <circle cx="174" cy="146" r="7" fill="#3a3d3a" />
  <text class="t" x="234" y="157" font-size="22" fill="#c9ccc6">创建账户 · Example</text>
  <rect x="130" y="183" width="920" height="38" rx="19" fill="#161716" />
  <path d="M157 196h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Zm2 0v-3a3 3 0 0 1 6 0v3" stroke="#6d716b" stroke-width="2" />
  <text class="m" x="182" y="210" font-size="22" fill="#9ca09a">example.com/signup</text>
  <rect x="90.5" y="110.5" width="999" height="779" rx="21.5" stroke="#30332f" />

  <text class="t" x="330" y="340" font-size="44" font-weight="600" fill="#1c1d1b">创建账户</text>
  <rect x="330" y="372" width="300" height="14" rx="7" fill="#d4d6d0" />
  <text class="t" x="330" y="444" font-size="22" fill="#6b6d67">邮箱</text>
  <rect x="331" y="459" width="518" height="62" rx="12" fill="#fff" stroke="#ee735a" stroke-width="2" />
  <text class="t" x="354" y="499" font-size="26" fill="#1c1d1b">riot@example.com</text>
  <text class="t" x="330" y="564" font-size="22" fill="#6b6d67">密码</text>
  <rect x="330.5" y="578.5" width="519" height="63" rx="12" fill="#fff" stroke="#d4d6d0" />
  <text class="t" x="354" y="620" font-size="26" letter-spacing="4" fill="#1c1d1b">••••••••••</text>
  <rect x="330" y="676" width="520" height="64" rx="12" fill="#1c1d1b" />
  <text class="t" x="590" y="717" text-anchor="middle" font-size="26" font-weight="500" fill="#fff">注册</text>
  <rect x="330" y="772" width="220" height="12" rx="6" fill="#dcded8" />

  <circle cx="660" cy="712" r="40" stroke="#ee735a" stroke-opacity="0.35" stroke-width="3" />
  <circle cx="660" cy="712" r="22" fill="#ee735a" fill-opacity="0.25" stroke="#ee735a" stroke-width="3" />
  <path d="M664 716 664 768 678 754 690 780 702 774 690 749 710 749Z" fill="#1c1d1b" stroke="#fff" stroke-width="3" stroke-linejoin="round" />

  <!-- Agent 操作 -->
  <rect x="1130.5" y="110.5" width="379" height="779" rx="21.5" fill="#1a1b1a" stroke="#30332f" />
  <text class="t" x="1166" y="174" font-size="30" font-weight="600" fill="#ecede9">Agent 操作</text>
  <path d="M1131 206.5H1509" stroke="#2a2d2a" />
  <path d="M1180 268V632" stroke="#2a2d2a" stroke-width="2" />

  <circle cx="1180" cy="250" r="18" fill="#203024" />
  <path d="m1172 250 5 5 10-10" stroke="#6cc48a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="m" x="1214" y="246" font-size="24" fill="#ecede9">navigate</text>
  <text class="m" x="1214" y="276" font-size="20" fill="#6d716b">/signup</text>

  <circle cx="1180" cy="350" r="18" fill="#203024" />
  <path d="m1172 350 5 5 10-10" stroke="#6cc48a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="m" x="1214" y="346" font-size="24" fill="#ecede9">fill</text>
  <text class="m" x="1214" y="376" font-size="20" fill="#6d716b">#email</text>

  <circle cx="1180" cy="450" r="18" fill="#203024" />
  <path d="m1172 450 5 5 10-10" stroke="#6cc48a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="m" x="1214" y="446" font-size="24" fill="#ecede9">fill</text>
  <text class="m" x="1214" y="476" font-size="20" fill="#6d716b">#password</text>

  <circle cx="1180" cy="550" r="18" fill="#1a1b1a" stroke="#3a3d3a" stroke-width="3" />
  <path d="M1180 532a18 18 0 0 1 18 18" stroke="#ee735a" stroke-width="3" stroke-linecap="round" />
  <text class="m" x="1214" y="546" font-size="24" fill="#ee735a">click</text>
  <text class="m" x="1214" y="576" font-size="20" fill="#6d716b">button[type=submit]</text>

  <circle cx="1180" cy="650" r="18" fill="#1a1b1a" stroke="#3a3d3a" stroke-width="3" />
  <text class="m" x="1214" y="646" font-size="24" fill="#6d716b">screenshot</text>
  <text class="m" x="1214" y="676" font-size="20" fill="#4a4e49">full page</text>

  <path d="M1131 772.5H1509" stroke="#2a2d2a" />
  <circle cx="1172" cy="830" r="6" fill="#ee735a" />
  <text class="m" x="1190" y="838" font-size="22" fill="#9ca09a">运行中 · 4 / 5</text>
</svg>
