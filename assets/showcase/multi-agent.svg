<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <title>多 Agent 协作示意：主任务把检索、分析与实现分给三个子 Agent</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#1f211f" />
      <stop offset="1" stop-color="#111211" />
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#fff" fill-opacity="0.05" />
    </pattern>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .m { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)" />
  <rect width="1600" height="1000" fill="url(#dots)" />

  <!-- 连线 -->
  <path d="M590 500C750 500 750 210 910 210M590 500C750 500 750 790 910 790" stroke="#3a3d3a" stroke-width="3" />
  <path d="M590 500H910" stroke="#ee735a" stroke-width="3" stroke-dasharray="10 10" />
  <circle cx="910" cy="210" r="7" fill="#111211" stroke="#5a5f59" stroke-width="2.5" />
  <circle cx="910" cy="500" r="7" fill="#111211" stroke="#ee735a" stroke-width="2.5" />
  <circle cx="910" cy="790" r="7" fill="#111211" stroke="#5a5f59" stroke-width="2.5" />

  <!-- 主任务 -->
  <rect x="110.5" y="320.5" width="479" height="359" rx="22" fill="#1a1b1a" stroke="#30332f" />
  <rect x="146" y="356" width="124" height="44" rx="22" fill="#ee735a" fill-opacity="0.14" />
  <text class="t" x="208" y="386" text-anchor="middle" font-size="24" fill="#ee735a">主任务</text>
  <text class="t" x="146" y="472" font-size="44" font-weight="600" fill="#ecede9">重构支付模块</text>
  <rect x="146" y="500" width="300" height="14" rx="7" fill="#2e312e" />
  <rect x="146" y="528" width="220" height="14" rx="7" fill="#2e312e" />
  <rect x="146" y="580" width="408" height="10" rx="5" fill="#2a2c2a" />
  <rect x="146" y="580" width="272" height="10" rx="5" fill="#ee735a" />
  <text class="t" x="146" y="640" font-size="24" fill="#9ca09a">3 个子 Agent · 2 / 3 完成</text>
  <circle cx="590" cy="500" r="8" fill="#1a1b1a" stroke="#5a5f59" stroke-width="2.5" />

  <!-- 子任务：检索（完成） -->
  <rect x="910.5" y="110.5" width="579" height="199" rx="20" fill="#1a1b1a" stroke="#30332f" />
  <circle cx="966" cy="180" r="22" fill="#6cc48a" fill-opacity="0.16" />
  <path d="m956 180 7 7 13-14" stroke="#6cc48a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="t" x="1006" y="192" font-size="34" font-weight="600" fill="#ecede9">检索代码</text>
  <text class="m" x="1454" y="190" text-anchor="end" font-size="22" fill="#6cc48a">done</text>
  <rect x="946" y="232" width="400" height="12" rx="6" fill="#2e312e" />
  <rect x="946" y="270" width="508" height="8" rx="4" fill="#6cc48a" fill-opacity="0.5" />

  <!-- 子任务：分析（进行中） -->
  <rect x="910.5" y="400.5" width="579" height="199" rx="20" fill="#1d1e1d" stroke="#ee735a" stroke-opacity="0.55" />
  <circle cx="966" cy="470" r="20" stroke="#3a3d3a" stroke-width="4" />
  <path d="M966 450a20 20 0 0 1 20 20" stroke="#ee735a" stroke-width="4" stroke-linecap="round" />
  <text class="t" x="1006" y="482" font-size="34" font-weight="600" fill="#ecede9">分析依赖</text>
  <text class="m" x="1454" y="480" text-anchor="end" font-size="22" fill="#ee735a">running</text>
  <rect x="946" y="522" width="360" height="12" rx="6" fill="#2e312e" />
  <rect x="946" y="560" width="508" height="8" rx="4" fill="#2a2c2a" />
  <rect x="946" y="560" width="300" height="8" rx="4" fill="#ee735a" />

  <!-- 子任务：实现（排队） -->
  <rect x="910.5" y="690.5" width="579" height="199" rx="20" fill="#1a1b1a" stroke="#30332f" />
  <circle cx="966" cy="760" r="20" stroke="#3a3d3a" stroke-width="3" />
  <path d="M966 750v10l7 6" stroke="#6d716b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="t" x="1006" y="772" font-size="34" font-weight="600" fill="#9ca09a">实现改动</text>
  <text class="m" x="1454" y="770" text-anchor="end" font-size="22" fill="#6d716b">queued</text>
  <rect x="946" y="812" width="420" height="12" rx="6" fill="#262826" />
  <rect x="946" y="850" width="508" height="8" rx="4" fill="#2a2c2a" />
</svg>
